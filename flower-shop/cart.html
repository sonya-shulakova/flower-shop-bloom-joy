<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — Bloom & Joy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Bloom<span>&amp;Joy</span></a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="subscription.html">Подписка</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <div style="display:flex;align-items:center;gap:1rem">
        <a href="cart.html" class="cart-btn">
          🛒 Корзина
          <span class="cart-count" style="display:none">0</span>
        </a>
        <button class="menu-toggle" aria-label="Меню">☰</button>
      </div>
    </div>
  </header>

  <div class="cart-page">
    <div class="section-title" style="margin-bottom:2rem">
      <h2 class="cat-title">Ваша корзина</h2>
    </div>

    <div id="cart-items"></div>

    <div class="cart-summary" id="cart-summary" style="display:none">
      <div class="row">
        <span>Доставка</span>
        <span>от 300 ₽</span>
      </div>
      <div class="row total">
        <span>Итого</span>
        <span id="cart-total">0 ₽</span>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:1.5rem" onclick="showToast('Спасибо за заказ! Мы свяжемся с вами для подтверждения 💐')">
        Оформить заказ
      </button>
      <p style="text-align:center;margin-top:1rem;font-size:0.9rem;color:#777">
        Или <a href="contacts.html" style="color:var(--raspberry)">свяжитесь с нами</a> для уточнения деталей
      </p>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
