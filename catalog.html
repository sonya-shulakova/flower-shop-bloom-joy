<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Bloom & Joy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Bloom<span>&amp;Joy</span></a>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="subscription.html">Подписка</a>
        <a href="contacts.html">Контакты</a>
      </nav>
      <div style="display:flex;align-items:center;gap:1rem">
        <a href="cart.html" class="cart-btn">
          🛒 Корзина
          <span class="cart-count" style="display:none">0</span>
        </a>
        <button class="menu-toggle" aria-label="Меню">☰</button>
      </div>
    </div>
  </header>

  <section class="section" style="padding-top:2rem">
    <div class="section-title">
      <h2 class="cat-title">Каталог цветов</h2>
      <h3 class="cat-subtitle">Выберите идеальный букет для любого случая</h3>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="mono">Монобукеты</button>
      <button class="filter-btn" data-filter="mixed">Составные</button>
      <button class="filter-btn" data-filter="box">Коробки и корзины</button>
      <button class="filter-btn" data-filter="wedding">Для свадеб</button>
    </div>

    <div class="products-grid" id="products-grid"></div>
  </section>

  <div id="footer-placeholder"></div>
  
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
